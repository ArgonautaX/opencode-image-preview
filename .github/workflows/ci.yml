name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck
